name: RPM Fedora 44

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpm-fedora44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rpm:
    name: Build ro-installer RPM on Fedora 44
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install Fedora 44 build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git \
            rpm-build \
            rsync \
            tar \
            gzip \
            findutils \
            coreutils \
            gawk \
            sed \
            grep \
            xz \
            unzip \
            which \
            curl \
            ca-certificates \
            clang \
            cmake \
            ninja-build \
            gtk3-devel \
            pkgconf-pkg-config \
            python3 \
            ripgrep

      - name: Install Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version
          /opt/flutter/bin/flutter config --enable-linux-desktop

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build RPM
        run: scripts/01-build-rpm.sh --source-mode git --require-clean-git

      - name: Verify release SRPM and manifest contract
        shell: bash
        run: |
          set -euo pipefail
          RPM_PATH="$(cat rpm-outputs/latest-rpm-path.txt)"
          SOURCE_RPM="$(find outputs/rpmbuild/SRPMS -maxdepth 1 -type f -name 'ro-installer-*.src.rpm' -print -quit)"
          test -f "$RPM_PATH"
          test -n "$SOURCE_RPM"
          test -f "$SOURCE_RPM"

          SOURCE_PACKAGE_FLAG="$(rpm -qp --qf '%{SOURCEPACKAGE}' "$SOURCE_RPM")"
          [[ "$SOURCE_PACKAGE_FLAG" == "1" ]] || {
            echo "Expected SOURCEPACKAGE=1 for SRPM, got: $SOURCE_PACKAGE_FLAG" >&2
            exit 1
          }
          [[ "$(rpm -qp --qf '%{SOURCERPM}' "$RPM_PATH")" == "$(basename "$SOURCE_RPM")" ]]

          rm -rf release-contract-test
          mkdir -p release-contract-test
          cp "$RPM_PATH" "$SOURCE_RPM" release-contract-test/
          python3 scripts/build-ro-repo-manifest.py             --artifacts-dir release-contract-test             --output release-contract-test/component-artifact-manifest-v1.json             --repository "$GITHUB_REPOSITORY"             --commit "$GITHUB_SHA"             --tag "ci-$GITHUB_RUN_ID"             --release-id "1"             --workflow-run "$GITHUB_RUN_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("release-contract-test/component-artifact-manifest-v1.json").read_text())
          arches = sorted(item["architecture"] for item in data["artifacts"])
          assert arches == ["src", "x86_64"], arches
          assert len(data["artifacts"]) == 2, data["artifacts"]
          PY

      - name: Verify Fedora 44 RPM and installability
        run: |
          set -euo pipefail
          RPM_PATH="$(cat rpm-outputs/latest-rpm-path.txt)"
          test -f "$RPM_PATH"
          rpm -qp --qf '%{NAME} %{VERSION} %{RELEASE} %{ARCH}\n' "$RPM_PATH"
          RPM_RELEASE="$(rpm -qp --qf '%{RELEASE}' "$RPM_PATH")"
          case "$RPM_RELEASE" in
            *.fc44) ;;
            *) echo "Expected Fedora 44 RPM release, got: $RPM_RELEASE" >&2; exit 1 ;;
          esac
          dnf -y --setopt=install_weak_deps=False install "$RPM_PATH"
          rpm -q ro-installer

      - name: Show build manifest
        if: always()
        run: |
          if [ -f rpm-outputs/latest-rpm-manifest.txt ]; then
            cat "$(cat rpm-outputs/latest-rpm-manifest.txt)"
          fi

      - name: Upload RPM artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-installer-rpm-fedora44
          if-no-files-found: error
          path: |
            rpm-outputs/*.rpm
            rpm-outputs/*.sha256
            rpm-outputs/*.build-manifest.txt
            rpm-outputs/*.source-files.txt
            rpm-outputs/latest-rpm-path.txt
            rpm-outputs/latest-rpm-manifest.txt
            outputs/logs/01-build-rpm-*.log
