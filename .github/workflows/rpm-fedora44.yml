name: RPM Fedora 44

env:
  FLUTTER_COMMIT: 5fc346839b5d0eef006ed8404392afb4dfae428d
  FLUTTER_TAG: 3.47.6

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: rpm-fedora44-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-namespace:
    name: Real namespace acceptance on Fedora 44
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: fedora:44
      # Only this disposable fixture job needs mount namespace capabilities.
      # Keep Docker's default seccomp profile and the RPM build isolation.
      options: --cap-add SYS_ADMIN --security-opt apparmor=unconfined
    steps:
      - name: Install namespace probe dependencies
        run: dnf -y --setopt=install_weak_deps=False install git python3 util-linux
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record namespace probe toolchain
        shell: bash
        run: |
          mkdir -p outputs/namespace-acceptance
          python3 --version > outputs/namespace-acceptance/toolchain.txt
          rpm -q python3 util-linux >> outputs/namespace-acceptance/toolchain.txt
          uname -r >> outputs/namespace-acceptance/toolchain.txt
          python3 - <<'PYTHON'
          from pathlib import Path
          fields = dict(line.split(':', 1) for line in Path('/proc/self/status').read_text().splitlines() if ':' in line)
          with Path('outputs/namespace-acceptance/toolchain.txt').open('a') as output:
              output.write('CapEff=' + fields['CapEff'].strip() + '\nSeccomp=' + fields['Seccomp'].strip() + '\n')
          assert int(fields['CapEff'].strip(), 16) & (1 << 21), 'SYS_ADMIN is required for the disposable fixture'
          assert fields['Seccomp'].strip() == '2', 'Docker seccomp filtering must remain enabled'
          PYTHON
      - name: Require real namespace acceptance
        run: bash scripts/check-namespace-ci.sh
      - name: Preserve namespace acceptance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-installer-namespace-fedora44
          if-no-files-found: error
          path: outputs/namespace-acceptance/

  build-rpm:
    name: Build ro-installer RPM on Fedora 44
    needs: real-namespace
    # Keep the existing required check failing, rather than skipped, on denial.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Require real namespace prerequisite
        if: needs.real-namespace.result != 'success'
        run: |
          echo "::error::Real namespace acceptance must pass before RPM build."
          exit 1
      - name: Install Fedora 44 build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git \
            rpm-build \
            cpio \
            rsync \
            acl \
            tar \
            gzip \
            findutils \
            coreutils \
            gawk \
            sed \
            grep \
            xz \
            unzip \
            which \
            curl \
            ca-certificates \
            clang \
            binutils \
            dbus-daemon \
            systemd-libs \
            cmake \
            ninja-build \
            gtk3-devel \
            pkgconf-pkg-config \
            python3 \
            dracut \
            kmod \
            util-linux \
            dosfstools \
            btrfs-progs \
            parted \
            ntfsprogs \
            ntfs-3g-libs \
            ripgrep

      - name: Install pinned Flutter SDK
        shell: bash
        run: |
          set -euo pipefail
          git init /opt/flutter
          git -C /opt/flutter remote add origin https://github.com/flutter/flutter.git
          # Fetch only the pin and its release tag for Flutter version detection.
          git -C /opt/flutter fetch --depth 1 --no-tags origin \
            "${FLUTTER_COMMIT}" "refs/tags/${FLUTTER_TAG}:refs/tags/${FLUTTER_TAG}"
          git -C /opt/flutter checkout --detach "${FLUTTER_COMMIT}"
          [[ "$(git -C /opt/flutter rev-parse HEAD)" == "${FLUTTER_COMMIT}" ]] || {
            echo "Flutter checkout does not match pinned commit ${FLUTTER_COMMIT}." >&2
            exit 1
          }
          [[ "$(git -C /opt/flutter rev-parse "refs/tags/${FLUTTER_TAG}^{commit}")" == "${FLUTTER_COMMIT}" ]] || {
            echo "Flutter tag ${FLUTTER_TAG} does not match pinned commit ${FLUTTER_COMMIT}." >&2
            exit 1
          }
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version
          /opt/flutter/bin/flutter config --enable-linux-desktop

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check documentation policy in the real checkout
        run: python3 scripts/check-source-policy.py --mode checkout

      - name: Measure bounded observability overhead (synthetic)
        run: |
          mkdir -p outputs/observability
          python3 -B test/fixtures/observability_benchmark.py --runs 5 > outputs/observability/benchmark.json
          cat outputs/observability/benchmark.json

      - name: Build RPM
        run: scripts/01-build-rpm.sh --source-mode git --require-clean-git

      - name: Verify release SRPM and manifest contract
        shell: bash
        run: |
          set -euo pipefail
          RPM_PATH="$(cat rpm-outputs/latest-rpm-path.txt)"
          SOURCE_RPM="$(find outputs/rpmbuild/SRPMS -maxdepth 1 -type f -name 'ro-installer-*.src.rpm' -print -quit)"
          test -f "$RPM_PATH"
          test -n "$SOURCE_RPM"
          test -f "$SOURCE_RPM"

          PUBSPEC_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          VERSION="${PUBSPEC_VERSION%%+*}"
          RPM_RELEASE="${PUBSPEC_VERSION##*+}.fc44"
          [[ "$(basename "$RPM_PATH")" == "ro-installer-${VERSION}-${RPM_RELEASE}.x86_64.rpm" ]]
          [[ "$(basename "$SOURCE_RPM")" == "ro-installer-${VERSION}-${RPM_RELEASE}.src.rpm" ]]
          [[ "$(rpm -qp --qf '%{NAME} %{EPOCHNUM} %{VERSION} %{RELEASE} %{ARCH}' "$RPM_PATH")" == "ro-installer 0 ${VERSION} ${RPM_RELEASE} x86_64" ]]
          [[ "$(rpm -qp --qf '%{NAME} %{EPOCHNUM} %{VERSION} %{RELEASE}' "$SOURCE_RPM")" == "ro-installer 0 ${VERSION} ${RPM_RELEASE}" ]]

          SOURCE_PACKAGE_FLAG="$(rpm -qp --qf '%{SOURCEPACKAGE}' "$SOURCE_RPM")"
          [[ "$SOURCE_PACKAGE_FLAG" == "1" ]] || {
            echo "Expected SOURCEPACKAGE=1 for SRPM, got: $SOURCE_PACKAGE_FLAG" >&2
            exit 1
          }
          [[ "$(rpm -qp --qf '%{SOURCERPM}' "$RPM_PATH")" == "$(basename "$SOURCE_RPM")" ]]

          mkdir -p outputs/release-contract-test
          cp "$RPM_PATH" "$SOURCE_RPM" outputs/release-contract-test/
          (cd outputs/release-contract-test && sha256sum *.rpm > SHA256SUMS && sha256sum --check --strict SHA256SUMS)
          python3 scripts/build-ro-repo-manifest.py             --artifacts-dir outputs/release-contract-test             --output outputs/release-contract-test/component-artifact-manifest-v1.json             --repository "$GITHUB_REPOSITORY"             --commit "$GITHUB_SHA"             --tag "ci-$GITHUB_RUN_ID"             --release-id "1"             --workflow-run "$GITHUB_RUN_ID"
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("outputs/release-contract-test/component-artifact-manifest-v1.json").read_text())
          arches = sorted(item["architecture"] for item in data["artifacts"])
          assert arches == ["src", "x86_64"], arches
          assert len(data["artifacts"]) == 2, data["artifacts"]
          PY

      - name: Verify Fedora 44 RPM and installability
        run: |
          set -euo pipefail
          RPM_PATH="$(cat rpm-outputs/latest-rpm-path.txt)"
          test -f "$RPM_PATH"
          rpm -qp --qf '%{NAME} %{VERSION} %{RELEASE} %{ARCH}\n' "$RPM_PATH"
          python3 -B scripts/check-helper-package.py "$RPM_PATH"
          [[ "$(rpm -qp --qf '[%{FILENAMES}|%{FILEMODES:perms}|%{FILEUSERNAME}|%{FILEGROUPNAME}\n]' "$RPM_PATH" | rg '^/usr/libexec/ro-installer-launcher.sh\|')" == '/usr/libexec/ro-installer-launcher.sh|-rwxr-xr-x|root|root' ]]
          RPM_RELEASE="$(rpm -qp --qf '%{RELEASE}' "$RPM_PATH")"
          case "$RPM_RELEASE" in
            *.fc44) ;;
            *) echo "Expected Fedora 44 RPM release, got: $RPM_RELEASE" >&2; exit 1 ;;
          esac
          dnf -y --setopt=install_weak_deps=False install "$RPM_PATH"
          rpm -q ro-installer
          python3 - <<'PY'
          import json
          import subprocess
          # Invalid protocol exits before any engine stage or disk access. This
          # catches RPM postprocessing that truncates Dart's appended snapshot.
          result = subprocess.run(
              ["/usr/libexec/ro-installer-backend", "--privileged-backend-v1"],
              input='{"protocolVersion":999}\n', text=True, capture_output=True,
              timeout=10, env={"PATH": "/usr/sbin:/usr/bin", "LC_ALL": "C", "HOME": "/root"},
          )
          assert result.returncode == 9, (result.returncode, result.stderr)
          assert result.stderr == "", result.stderr
          assert json.loads(result.stdout) == {
              "protocolVersion": 1, "type": "result", "ok": False, "code": "BACKEND_ERROR",
          }, result.stdout
          PY

      - name: Show build manifest
        if: always()
        run: |
          if [ -f rpm-outputs/latest-rpm-manifest.txt ]; then
            cat "$(cat rpm-outputs/latest-rpm-manifest.txt)"
          fi

      - name: Upload RPM artifacts
        # Early setup failures have no build output; successful jobs still require artifacts.
        if: always() && (success() || hashFiles('rpm-outputs/*.rpm', 'outputs/logs/01-build-rpm-*.log') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-installer-rpm-fedora44
          if-no-files-found: error
          path: |
            rpm-outputs/*.rpm
            rpm-outputs/*.sha256
            rpm-outputs/*.build-manifest.txt
            rpm-outputs/*.source-files.txt
            rpm-outputs/latest-rpm-path.txt
            rpm-outputs/latest-rpm-manifest.txt
            outputs/observability/
            outputs/release-contract-test/
            outputs/logs/01-build-rpm-*.log
