name: Release

"on":
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_COMMIT: 5fc346839b5d0eef006ed8404392afb4dfae428d

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      rpm_release: ${{ steps.meta.outputs.rpm_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Validate exact tag and version identity
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PUBSPEC_VERSION="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          PROJECT_VERSION="${PUBSPEC_VERSION%%+*}"
          RPM_RELEASE="${PUBSPEC_VERSION##*+}"
          SPEC_DEFAULT_VERSION="$(sed -n -E 's/^Version:[[:space:]]+%\{\?app_version\}%\{!\?app_version:([^}]+)\}$/\1/p' ro-installer.spec | head -n1)"

          [[ -n "${VERSION}" ]]
          [[ "${TAG}" == "v${VERSION}" ]]
          [[ "${VERSION}" == "${PROJECT_VERSION}" ]]
          [[ "${VERSION}" == "${SPEC_DEFAULT_VERSION}" ]]
          [[ "${RPM_RELEASE}" =~ ^[0-9]+$ ]]
          [[ "$(git rev-parse HEAD)" == "${GITHUB_SHA}" ]]
          [[ "$(git rev-parse "refs/tags/${TAG}^{commit}")" == "${GITHUB_SHA}" ]]

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "rpm_release=${RPM_RELEASE}" >> "${GITHUB_OUTPUT}"

  rpm:
    name: Build exact Fedora 44 RPM set
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      binary_name: ${{ steps.bundle.outputs.binary_name }}
      binary_sha256: ${{ steps.bundle.outputs.binary_sha256 }}
      source_name: ${{ steps.bundle.outputs.source_name }}
      source_sha256: ${{ steps.bundle.outputs.source_sha256 }}
      artifact_id: ${{ steps.upload_rpms.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload_rpms.outputs.artifact-digest }}
    container:
      image: fedora:44

    steps:
      - name: Install Fedora 44 build dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False install \
            git \
            rpm-build \
            rsync \
            tar \
            gzip \
            findutils \
            coreutils \
            gawk \
            sed \
            grep \
            xz \
            unzip \
            which \
            curl \
            ca-certificates \
            clang \
            cmake \
            ninja-build \
            gtk3-devel \
            pkgconf-pkg-config \
            python3 \
            ripgrep

      - name: Install pinned Flutter SDK
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git /opt/flutter
          [[ "$(git -C /opt/flutter rev-parse HEAD)" == "${FLUTTER_COMMIT}" ]] || {
            echo "Flutter stable moved away from tested commit ${FLUTTER_COMMIT}; update the pin through reviewed CI." >&2
            exit 1
          }
          echo "/opt/flutter/bin" >> "$GITHUB_PATH"
          /opt/flutter/bin/flutter --version
          /opt/flutter/bin/flutter config --enable-linux-desktop

      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build committed source as RPM and SRPM
        run: scripts/01-build-rpm.sh --source-mode git --require-clean-git

      - name: Collect and verify exact release RPM set
        id: bundle
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RPM_RELEASE: ${{ needs.metadata.outputs.rpm_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-rpms

          BINARY_RPM="$(cat rpm-outputs/latest-rpm-path.txt)"
          test -f "${BINARY_RPM}"
          SOURCE_RPM="$(find outputs/rpmbuild/SRPMS -maxdepth 1 -type f -name "ro-installer-${VERSION}-${RPM_RELEASE}*.src.rpm" -print -quit)"
          test -n "${SOURCE_RPM}"
          test -f "${SOURCE_RPM}"

          [[ "$(rpm -qp --qf '%{NAME}' "${BINARY_RPM}")" == "ro-installer" ]]
          [[ "$(rpm -qp --qf '%{VERSION}' "${BINARY_RPM}")" == "${VERSION}" ]]
          [[ "$(rpm -qp --qf '%{RELEASE}' "${BINARY_RPM}")" == "${RPM_RELEASE}.fc44" ]]
          [[ "$(rpm -qp --qf '%{ARCH}' "${BINARY_RPM}")" == "x86_64" ]]

          [[ "$(rpm -qp --qf '%{NAME}' "${SOURCE_RPM}")" == "ro-installer" ]]
          [[ "$(rpm -qp --qf '%{VERSION}' "${SOURCE_RPM}")" == "${VERSION}" ]]
          [[ "$(rpm -qp --qf '%{RELEASE}' "${SOURCE_RPM}")" == "${RPM_RELEASE}.fc44" ]]
          SOURCE_PACKAGE_FLAG="$(rpm -qp --qf '%{SOURCEPACKAGE}' "${SOURCE_RPM}")"
          [[ "${SOURCE_PACKAGE_FLAG}" == "1" ]] || {
            echo "Expected SOURCEPACKAGE=1 for SRPM, got: ${SOURCE_PACKAGE_FLAG}" >&2
            exit 1
          }
          [[ "$(rpm -qp --qf '%{SOURCERPM}' "${BINARY_RPM}")" == "$(basename "${SOURCE_RPM}")" ]]

          cp "${BINARY_RPM}" "${SOURCE_RPM}" release-rpms/

          BINARY_NAME="$(basename "${BINARY_RPM}")"
          SOURCE_NAME="$(basename "${SOURCE_RPM}")"
          BINARY_SHA256="$(sha256sum "release-rpms/${BINARY_NAME}" | awk '{print $1}')"
          SOURCE_SHA256="$(sha256sum "release-rpms/${SOURCE_NAME}" | awk '{print $1}')"
          echo "binary_name=${BINARY_NAME}" >> "${GITHUB_OUTPUT}"
          echo "binary_sha256=${BINARY_SHA256}" >> "${GITHUB_OUTPUT}"
          echo "source_name=${SOURCE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "source_sha256=${SOURCE_SHA256}" >> "${GITHUB_OUTPUT}"

      - name: Install binary RPM
        shell: bash
        run: |
          set -euo pipefail
          BINARY_RPM="$(find release-rpms -maxdepth 1 -type f -name '*.x86_64.rpm' -print -quit)"
          test -n "${BINARY_RPM}"
          dnf -y --setopt=install_weak_deps=False install "${BINARY_RPM}"
          rpm -q ro-installer
          command -v ro-installer

      - name: Upload exact RPM build output
        id: upload_rpms
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ro-installer-release-${{ needs.metadata.outputs.version }}
          path: release-rpms/*.rpm
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish attested Ro-Repo V2 release
    needs: [metadata, rpm]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download exact RPM set by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ needs.rpm.outputs.artifact_id }}
          path: release-assets
          digest-mismatch: error

      - name: Install release metadata tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm jq
          gh --version

      - name: Verify release bundle before publication
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          RPM_RELEASE: ${{ needs.metadata.outputs.rpm_release }}
          EXPECTED_BINARY_NAME: ${{ needs.rpm.outputs.binary_name }}
          EXPECTED_BINARY_SHA256: ${{ needs.rpm.outputs.binary_sha256 }}
          EXPECTED_SOURCE_NAME: ${{ needs.rpm.outputs.source_name }}
          EXPECTED_SOURCE_SHA256: ${{ needs.rpm.outputs.source_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find release-assets -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          [[ "${#RPMS[@]}" -eq 2 ]]

          ARCHES="$(
            for item in "${RPMS[@]}"; do
              SOURCE_PACKAGE_FLAG="$(rpm -qp --qf '%{SOURCEPACKAGE}' "release-assets/${item}")"
              if [[ "${SOURCE_PACKAGE_FLAG}" == "1" ]]; then
                printf 'src\n'
              else
                rpm -qp --qf '%{ARCH}\n' "release-assets/${item}"
              fi
            done | sort | paste -sd, -
          )"
          [[ "${ARCHES}" == "src,x86_64" ]]

          SOURCE_RPM="$(printf '%s\n' "${RPMS[@]}" | grep '\.src\.rpm$')"
          BINARY_RPM="$(printf '%s\n' "${RPMS[@]}" | grep '\.x86_64\.rpm$')"
          test -n "${SOURCE_RPM}"
          test -n "${BINARY_RPM}"
          [[ "${BINARY_RPM}" == "${EXPECTED_BINARY_NAME}" ]]
          [[ "${SOURCE_RPM}" == "${EXPECTED_SOURCE_NAME}" ]]
          [[ "$(sha256sum "release-assets/${BINARY_RPM}" | awk '{print $1}')" == "${EXPECTED_BINARY_SHA256}" ]]
          [[ "$(sha256sum "release-assets/${SOURCE_RPM}" | awk '{print $1}')" == "${EXPECTED_SOURCE_SHA256}" ]]

          for item in "${RPMS[@]}"; do
            [[ "$(rpm -qp --qf '%{NAME}' "release-assets/${item}")" == "ro-installer" ]]
            [[ "$(rpm -qp --qf '%{VERSION}' "release-assets/${item}")" == "${VERSION}" ]]
            [[ "$(rpm -qp --qf '%{RELEASE}' "release-assets/${item}")" == "${RPM_RELEASE}.fc44" ]]
          done
          [[ "$(rpm -qp --qf '%{SOURCERPM}' "release-assets/${BINARY_RPM}")" == "${SOURCE_RPM}" ]]

      - name: Create clean draft GitHub Release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > release-pages.json
          jq '[.[][] | {tagName: .tag_name, isDraft: .draft}]' \
            release-pages.json > release-list.json

          RELEASE_STATE="$(
            python3 scripts/release-state.py --tag "${TAG}" --input release-list.json |
              jq -r '.state'
          )"

          case "${RELEASE_STATE}" in
            absent)
              ;;
            draft)
              echo "Draft release ${TAG} already exists; automatic destructive recovery is forbidden." >&2
              echo "Inspect and clean the stale draft explicitly before retrying." >&2
              exit 1
              ;;
            published)
              echo "Published release ${TAG} already exists; tag/release reuse is forbidden." >&2
              exit 1
              ;;
            *)
              echo "Unexpected release state for ${TAG}: ${RELEASE_STATE}" >&2
              exit 1
              ;;
          esac

          REMOTE_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG}" --jq '.sha')"
          [[ "${REMOTE_TAG_SHA}" == "${GITHUB_SHA}" ]]

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes

          RELEASE_ID="$(
            gh release view "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json databaseId,isDraft,tagName \
              --jq 'select(.tagName == env.GITHUB_REF_NAME and .isDraft == true) | .databaseId'
          )"
          [[ "${RELEASE_ID}" =~ ^[1-9][0-9]*$ ]]
          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"

      - name: Generate strict SHA256SUMS
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t RPMS < <(find . -maxdepth 1 -type f -name '*.rpm' -printf '%f\n' | sort)
          [[ "${#RPMS[@]}" -eq 2 ]]
          sha256sum "${RPMS[@]}" > SHA256SUMS
          [[ "$(wc -l < SHA256SUMS)" -eq 2 ]]

      - name: Generate component artifact manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-ro-repo-manifest.py \
            --artifacts-dir release-assets \
            --output release-assets/component-artifact-manifest-v1.json \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${GITHUB_SHA}" \
            --tag "${GITHUB_REF_NAME}" \
            --release-id "${{ steps.draft.outputs.release_id }}" \
            --workflow-run "${GITHUB_RUN_ID}"

      - name: Attest RPMs, checksum file and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/*.rpm
            release-assets/SHA256SUMS
            release-assets/component-artifact-manifest-v1.json

      - name: Upload immutable release asset set
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/*.rpm \
            release-assets/SHA256SUMS \
            release-assets/component-artifact-manifest-v1.json \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify draft assets and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t EXPECTED < <(
            {
              find release-assets -maxdepth 1 -type f -name '*.rpm' -printf '%f\n'
              printf '%s\n' SHA256SUMS component-artifact-manifest-v1.json
            } | sort
          )
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          [[ "$(jq -r '.id' <<<"${RELEASE_JSON}")" == "${RELEASE_ID}" ]]
          [[ "$(jq -r '.tag_name' <<<"${RELEASE_JSON}")" == "${GITHUB_REF_NAME}" ]]
          [[ "$(jq -r '.draft' <<<"${RELEASE_JSON}")" == "true" ]]

          REMOTE_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha')"
          [[ "${REMOTE_TAG_SHA}" == "${GITHUB_SHA}" ]]

          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --paginate > remote-assets.json
          mapfile -t ACTUAL < <(jq -r '.[].name' remote-assets.json | sort)
          [[ "${#EXPECTED[@]}" -eq 4 ]]
          diff -u <(printf '%s\n' "${EXPECTED[@]}") <(printf '%s\n' "${ACTUAL[@]}")

          for name in "${EXPECTED[@]}"; do
            LOCAL_DIGEST="sha256:$(sha256sum "release-assets/${name}" | awk '{print $1}')"
            REMOTE_STATE="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .state' remote-assets.json)"
            REMOTE_DIGEST="$(jq -r --arg name "${name}" '.[] | select(.name == $name) | .digest' remote-assets.json)"
            [[ "${REMOTE_STATE}" == "uploaded" ]]
            [[ "${REMOTE_DIGEST}" == "${LOCAL_DIGEST}" ]]
          done

          set +e
          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false > publish-response.json 2> publish-error.log
          PUBLISH_RC=$?
          set -e

          FINAL_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          [[ "$(jq -r '.id' <<<"${FINAL_JSON}")" == "${RELEASE_ID}" ]]
          [[ "$(jq -r '.tag_name' <<<"${FINAL_JSON}")" == "${GITHUB_REF_NAME}" ]]
          [[ "$(jq -r '.draft' <<<"${FINAL_JSON}")" == "false" ]]
          [[ "$(jq -r '.immutable' <<<"${FINAL_JSON}")" == "true" ]]
          FINAL_TAG_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha')"
          [[ "${FINAL_TAG_SHA}" == "${GITHUB_SHA}" ]]

          if [[ "${PUBLISH_RC}" -ne 0 ]]; then
            echo "Publish request returned non-zero, but follow-up verification proves the exact immutable release was published." >&2
            cat publish-error.log >&2 || true
          fi
